<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💝 هدية لأغلى شخص 💝</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;700;800&family=Lemonada:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p0: #fff0f5;
            --p1: #ffd6e7;
            --p2: #ffb3d1;
            --p3: #ff85b3;
            --p4: #ff4d94;
            --p5: #d4006a;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Baloo Bhaijaan 2', 'Lemonada', sans-serif;
            background: linear-gradient(135deg, #ffe4f0 0%, #ffd1e8 40%, #ffc2df 100%);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle, #ffb3d188 1px, transparent 1px),
                radial-gradient(circle, #ff85b355 1px, transparent 1px);
            background-size: 28px 28px, 14px 14px;
            background-position: 0 0, 14px 14px;
            pointer-events: none;
            z-index: 0;
        }

        /* شخابيط الخلفية */
        .doodles-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .doodle {
            position: absolute;
            opacity: 0.2;
            animation: doodlefloat 6s ease-in-out infinite;
            font-size: 2rem;
        }
        @keyframes doodlefloat {
            0%,100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-14px) rotate(5deg); }
        }

        /* ===== صفحة القفل ===== */
        #login-page {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(10px, 2.5vw, 18px);
            padding: clamp(10px, 3vw, 20px);
            width: 100%;
            max-width: min(400px, 100vw);
            box-sizing: border-box;
        }

        .lock-card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(18px);
            border-radius: 36px;
            padding: 28px 24px 20px;
            box-shadow:
                0 8px 32px rgba(255,77,148,0.2),
                inset 0 0 0 2.5px rgba(255,179,209,0.7);
            width: 100%;
            text-align: center;
            position: relative;
        }

        /* ريبة أعلى */
        .bow-top {
            position: absolute;
            top: -26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            filter: drop-shadow(0 3px 8px rgba(255,77,148,0.5));
            animation: bowbounce 2.2s ease-in-out infinite;
        }
        @keyframes bowbounce {
            0%,100% { transform: translateX(-50%) scale(1) rotate(-4deg); }
            50% { transform: translateX(-50%) scale(1.12) rotate(4deg); }
        }

        /* عنوان كيوت مزخرف */
        .lock-title {
            font-family: 'Lemonada', 'Baloo Bhaijaan 2', sans-serif;
            color: var(--p4);
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 6px;
            line-height: 1.8;
            text-shadow:
                2px 2px 0px rgba(255,179,209,0.8),
                0 0 20px rgba(255,77,148,0.15);
            letter-spacing: 0.5px;
        }
        .lock-subtitle {
            font-family: 'Lemonada', sans-serif;
            color: var(--p3);
            font-size: 0.82rem;
            margin-bottom: 14px;
            font-weight: 600;
        }

        /* عرض التاريخ */
        .date-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255,255,255,0.9);
            border: 2.5px solid var(--p2);
            border-radius: 20px;
            padding: 10px 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(255,133,179,0.12);
        }
        .date-segment {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .date-label {
            font-family: 'Lemonada', sans-serif;
            font-size: 0.58rem;
            color: var(--p3);
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .date-value {
            font-family: 'Baloo Bhaijaan 2', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--p4);
            min-width: 46px;
            text-align: center;
            background: var(--p1);
            border-radius: 12px;
            padding: 4px 8px;
            letter-spacing: 4px;
            border: 2px solid var(--p2);
            transition: all 0.25s;
        }
        .date-value.active {
            border-color: var(--p4);
            background: #fff0f8;
            box-shadow: 0 0 0 4px rgba(255,77,148,0.15);
            color: var(--p5);
        }
        .date-sep {
            font-size: 1.4rem;
            color: var(--p2);
            font-weight: 800;
            margin-top: 16px;
        }

        /* نقاط التقدم */
        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 8px 0;
        }
        .progress-dot {
            width: 11px; height: 11px;
            border-radius: 50%;
            background: var(--p1);
            border: 2px solid var(--p2);
            transition: all 0.25s;
        }
        .progress-dot.filled {
            background: var(--p4);
            border-color: var(--p5);
            transform: scale(1.25);
            box-shadow: 0 0 8px rgba(255,77,148,0.5);
        }

        .error-msg {
            font-family: 'Lemonada', sans-serif;
            color: #ff3366;
            font-size: 0.82rem;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
            padding: 6px 14px;
            border-radius: 12px;
            background: rgba(255,51,102,0.07);
            min-height: 28px;
        }
        .error-msg.show { opacity: 1; }

        /* لوحة المفاتيح — fluid بالكامل */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(8px, 2.5vw, 13px);
            padding: clamp(12px, 3vw, 18px);
            background: rgba(255,255,255,0.55);
            border-radius: 28px;
            box-shadow:
                0 4px 20px rgba(255,77,148,0.12),
                inset 0 0 0 2px rgba(255,179,209,0.45);
            width: 100%;
            box-sizing: border-box;
        }

        .key {
            /* لا حجم ثابت — يتكيف مع الشبكة */
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #ffd6e8, #ffaad0);
            color: white;
            font-family: 'Baloo Bhaijaan 2', sans-serif;
            font-size: clamp(1rem, 5vw, 1.5rem);
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 5px 0 #e05090, 0 7px 14px rgba(255,77,148,0.28);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .key::after {
            content: '';
            position: absolute;
            top: 12%; left: 18%;
            width: 38%; height: 22%;
            background: rgba(255,255,255,0.38);
            border-radius: 50%;
            pointer-events: none;
        }
        .key:active { transform: translateY(4px); box-shadow: 0 1px 0 #e05090; }
        @media (hover: hover) {
            .key:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #e05090, 0 9px 18px rgba(255,77,148,0.32); }
        }

        .key-back { font-size: clamp(0.9rem, 4vw, 1.2rem); }
        .key-enter {
            background: linear-gradient(145deg, #a8e6a8, #5cbf5c);
            box-shadow: 0 5px 0 #3d9a3d, 0 7px 14px rgba(0,120,0,0.22);
        }
        .key-enter:active { box-shadow: 0 1px 0 #3d9a3d; }

        /* ===== صفحة المحتوى ===== */
        #main-content {
            display: none;
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 14px;
            max-height: 100vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--p2) transparent;
            animation: popIn 0.65s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.72) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .main-card {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(22px);
            border-radius: 42px;
            padding: 24px 18px 28px;
            box-shadow:
                0 14px 44px rgba(255,77,148,0.24),
                inset 0 0 0 3px rgba(255,179,209,0.55);
            text-align: center;
            position: relative;
        }

        .main-title {
            font-family: 'Lemonada', 'Baloo Bhaijaan 2', sans-serif;
            color: var(--p4);
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 2px;
            text-shadow:
                2px 3px 0px rgba(255,179,209,0.9),
                0 0 30px rgba(255,77,148,0.2);
            letter-spacing: 0.5px;
        }
        .main-subtitle {
            font-family: 'Lemonada', sans-serif;
            color: var(--p3);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* ===== إطار الفيديو بزوايا هيلو كيتي ===== */
        .video-outer {
            position: relative;
            margin-bottom: 20px;
            padding: 12px;
        }

        /* وجوه هيلو كيتي في الزوايا */
        .hk-corner {
            position: absolute;
            width: 46px;
            height: 46px;
            z-index: 5;
        }
        .hk-corner.tl { top: 0; right: 0; }
        .hk-corner.tr { top: 0; left: 0; transform: scaleX(-1); }
        .hk-corner.bl { bottom: 0; right: 0; transform: scaleY(-1); }
        .hk-corner.br { bottom: 0; left: 0; transform: scale(-1,-1); }

        /* SVG هيلو كيتي */
        .hk-face {
            width: 46px;
            height: 46px;
        }

        .video-frame {
            width: 100%;
            border-radius: 22px;
            overflow: hidden;
            border: 4px solid var(--p2);
            box-shadow:
                0 6px 28px rgba(255,77,148,0.22),
                0 0 0 2px rgba(255,209,230,0.5);
            background: #ffe0ef;
            position: relative;
        }

        .video-frame video {
            width: 100%;
            max-height: 290px;
            display: block;
            object-fit: cover;
        }

        .video-placeholder {
            padding: 36px 24px;
            color: var(--p3);
            font-family: 'Lemonada', sans-serif;
            font-size: 0.88rem;
            line-height: 2.2;
        }
        .video-placeholder .vid-icon { font-size: 3.2rem; display: block; margin-bottom: 8px; }

        /* ===== أزرار هيلو كيتي ===== */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 13px;
            margin-top: 4px;
        }

        .action-btn {
            border: none;
            padding: 0;
            background: none;
            cursor: pointer;
            position: relative;
            font-family: 'Lemonada', 'Baloo Bhaijaan 2', sans-serif;
        }

        .btn-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Lemonada', sans-serif;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }
        .btn-inner::before {
            content: '';
            position: absolute;
            top: 5px; left: 18px;
            width: 32%; height: 30%;
            background: rgba(255,255,255,0.32);
            border-radius: 50%;
            pointer-events: none;
        }

        .action-btn:hover .btn-inner { transform: translateY(-3px) scale(1.02); }
        .action-btn:active .btn-inner { transform: translateY(2px) scale(0.98); }

        .btn-love .btn-inner {
            background: linear-gradient(135deg, #ff85b3, #ff4d94);
            color: white;
            box-shadow: 0 6px 0 #c9006b, 0 9px 22px rgba(255,77,148,0.32);
        }
        .btn-love:hover .btn-inner { box-shadow: 0 8px 0 #c9006b, 0 12px 28px rgba(255,77,148,0.38); }
        .btn-love:active .btn-inner { box-shadow: 0 1px 0 #c9006b; }

        .btn-memory .btn-inner {
            background: linear-gradient(135deg, #ffb3d1, #ff7db5);
            color: white;
            box-shadow: 0 6px 0 #d4006a, 0 9px 22px rgba(255,125,181,0.32);
        }
        .btn-memory:hover .btn-inner { box-shadow: 0 8px 0 #d4006a, 0 12px 28px rgba(255,125,181,0.38); }
        .btn-memory:active .btn-inner { box-shadow: 0 1px 0 #d4006a; }

        .btn-photo .btn-inner {
            background: linear-gradient(135deg, #ffd6e8, #ffaece);
            color: var(--p5);
            box-shadow: 0 6px 0 #e07aaa, 0 9px 22px rgba(255,174,206,0.32);
        }
        .btn-photo:hover .btn-inner { box-shadow: 0 8px 0 #e07aaa, 0 12px 28px rgba(255,174,206,0.38); }
        .btn-photo:active .btn-inner { box-shadow: 0 1px 0 #e07aaa; }

        /* وجه هيلو كيتي صغير جنب نص الزر */
        .hk-mini {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        /* منطقة الصورة */
        #photo-area {
            margin-top: 14px;
            display: none;
            animation: popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        #photo-area img {
            width: 100%;
            border-radius: 22px;
            border: 3px solid var(--p2);
            box-shadow: 0 5px 22px rgba(255,77,148,0.22);
        }
        .photo-placeholder {
            background: linear-gradient(135deg, var(--p1), var(--p0));
            border: 3px dashed var(--p2);
            border-radius: 22px;
            padding: 28px;
            color: var(--p3);
            font-family: 'Lemonada', sans-serif;
            font-size: 0.85rem;
            line-height: 2.2;
        }

        /* زينة الأركان للبطاقة */
        .card-deco {
            position: absolute;
            pointer-events: none;
            font-size: 1.3rem;
            opacity: 0.28;
            animation: doodlefloat 5s ease-in-out infinite;
        }
        .card-deco-tl { top: 14px; right: 18px; animation-delay: 0.5s; }
        .card-deco-tr { top: 14px; left: 18px; animation-delay: 1s; }
        .card-deco-bl { bottom: 14px; right: 18px; animation-delay: 1.5s; }
        .card-deco-br { bottom: 14px; left: 18px; animation-delay: 0s; }

        /* ===== بوبأب الرسائل ===== */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,77,148,0.18);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeOverlay 0.3s ease;
        }
        @keyframes fadeOverlay { from{opacity:0} to{opacity:1} }

        .popup-card {
            background: white;
            border-radius: 36px;
            padding: 30px 26px;
            max-width: 320px;
            width: 100%;
            text-align: center;
            box-shadow:
                0 22px 60px rgba(255,77,148,0.32),
                inset 0 0 0 3px rgba(255,179,209,0.55);
            animation: popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            position: relative;
        }
        .popup-hk {
            width: 60px; height: 60px;
            margin: 0 auto 10px;
            animation: iconpop 0.5s 0.1s cubic-bezier(0.175,0.885,0.32,1.275) both;
        }
        @keyframes iconpop { from{transform:scale(0) rotate(-20deg)} to{transform:scale(1) rotate(0deg)} }
        .popup-title {
            font-family: 'Lemonada', sans-serif;
            color: var(--p5);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 1px 2px 0 rgba(255,179,209,0.7);
        }
        .popup-text {
            font-family: 'Baloo Bhaijaan 2', sans-serif;
            color: #888;
            font-size: 0.95rem;
            line-height: 2;
            font-weight: 500;
        }
        .popup-close {
            margin-top: 18px;
            background: linear-gradient(135deg, #ff85b3, #ff4d94);
            color: white;
            border: none;
            padding: 11px 28px;
            border-radius: 50px;
            font-family: 'Lemonada', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #c9006b;
            transition: all 0.15s;
        }
        .popup-close:active { transform: translateY(4px); box-shadow: none; }

        /* ===== فراشات وانفجار فتح الصفحة ===== */
        .butterfly {
            position: fixed;
            pointer-events: none;
            z-index: 500;
            animation: butterflyFly linear forwards;
            will-change: transform, opacity;
        }
        @keyframes butterflyFly {
            0% { opacity: 1; transform: translate(0,0) scale(0.4) rotate(0deg); }
            20% { opacity: 1; transform: translate(var(--dx1),var(--dy1)) scale(1.3) rotate(var(--r1)); }
            60% { opacity: 0.85; transform: translate(var(--dx2),var(--dy2)) scale(1) rotate(var(--r2)); }
            100% { opacity: 0; transform: translate(var(--dx3),var(--dy3)) scale(0.2) rotate(var(--r3)); }
        }

        .confetti-piece {
            position: fixed;
            pointer-events: none;
            z-index: 499;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        /* إيموجي يتطاير عند ضغط الأزرار */
        .btn-emoji {
            position: fixed;
            pointer-events: none;
            z-index: 600;
            font-size: 1.4rem;
            animation: emojiFloat ease-out forwards;
        }
        @keyframes emojiFloat {
            0% { transform: translate(0,0) scale(0.5) rotate(0deg); opacity: 1; }
            60% { opacity: 1; }
            100% { transform: translate(var(--ex), var(--ey)) scale(1.2) rotate(var(--er)); opacity: 0; }
        }

        /* ===== تحسينات اللمس ===== */
        button, .action-btn {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* ===== جوال صغير (تحت 480px) ===== */
        @media (max-width: 480px) {
            .lock-title { font-size: clamp(0.9rem, 4.5vw, 1.2rem); }
            .lock-subtitle { font-size: clamp(0.7rem, 3vw, 0.82rem); }
            .lock-card { padding: clamp(18px,4vw,28px) clamp(12px,3vw,24px) clamp(14px,3vw,20px); }
            .date-value { font-size: clamp(1rem, 5vw, 1.4rem); min-width: clamp(34px, 10vw, 46px); }
            .date-sep { font-size: clamp(1rem, 4vw, 1.3rem); margin-top: clamp(10px,3vw,16px); }
            .main-title { font-size: clamp(1.1rem, 5vw, 1.5rem); }
            .main-subtitle { font-size: clamp(0.75rem, 3vw, 0.85rem); }
            .btn-inner { font-size: clamp(0.8rem, 3.5vw, 1rem); padding: clamp(10px,3vw,14px) clamp(10px,3vw,20px); }
            .hk-mini { width: clamp(20px,5vw,28px); height: clamp(20px,5vw,28px); }
            .popup-card { padding: clamp(20px,5vw,30px) clamp(14px,4vw,26px); }
            .hk-corner { width: clamp(30px,8vw,46px); height: clamp(30px,8vw,46px); }
            .hk-face { width: clamp(30px,8vw,46px); height: clamp(30px,8vw,46px); }
            .video-frame iframe { height: clamp(180px, 45vw, 280px) !important; }
        }

        /* ===== شاشات كبيرة ===== */
        @media (min-width: 600px) {
            body { align-items: center; }
            #main-content { max-height: 100dvh; overflow-y: auto; }
        }
    </style>
</head>
<body>

<!-- شخابيط الخلفية -->
<div class="doodles-bg">
    <div class="doodle" style="top:4%;left:4%;animation-delay:0s;font-size:2.4rem">🌸</div>
    <div class="doodle" style="top:12%;right:6%;animation-delay:1.1s;font-size:1.9rem">✨</div>
    <div class="doodle" style="top:22%;left:2%;animation-delay:2.2s;font-size:2rem">💕</div>
    <div class="doodle" style="top:38%;right:3%;animation-delay:0.6s;font-size:2.1rem">🎀</div>
    <div class="doodle" style="top:52%;left:5%;animation-delay:1.7s;font-size:1.6rem">⭐</div>
    <div class="doodle" style="top:66%;right:4%;animation-delay:2.7s;font-size:2.3rem">🌸</div>
    <div class="doodle" style="top:78%;left:3%;animation-delay:0.9s;font-size:1.7rem">💗</div>
    <div class="doodle" style="top:88%;right:6%;animation-delay:3.1s;font-size:1.9rem">✨</div>
    <div class="doodle" style="top:7%;left:44%;animation-delay:1.3s;font-size:1.5rem">🍓</div>
    <div class="doodle" style="top:94%;left:38%;animation-delay:0.4s;font-size:1.7rem">🌷</div>

<script>
    // ============================================================
    //  ⚙️ الإعدادات — غيّري هنا فقط
    // ============================================================
    const CORRECT_DAY   = "01";   // اليوم
    const CORRECT_MONTH = "01";   // الشهر
    const CORRECT_YEAR  = "2024"; // السنة

    // الفيديو: اكتبي رابط يوتيوب مثل: "https://www.youtube.com/watch?v=XXXXXXX"
    // أو اتركيه "video.mp4" إذا رفعتِ الملف مباشرة
    const VIDEO_URL = "video.mp4";

    const LOVE_MESSAGE  = "إنتِ أغلى شي بحياتي وأحب وجودك بجنبي كل يوم، الله يديمنا لبعض ويزيدنا حب 💕";
    const MEMORY_TEXT   = "تتذكرين أول يوم التقينا؟ كان أحلى يوم بحياتي، وكل يوم معاكِ بيكون أحلى من اللي قبله 🌸";
    // ============================================================

    // ===== تشغيل الموسيقى أول ما يتفاعل المستخدم =====
    let musicStarted = false;
    function tryPlayMusic() {
        if (!musicStarted) {
            document.getElementById('bg-music').play().then(() => {
                musicStarted = true;
            }).catch(() => {});
        }
    }
    document.addEventListener('click', tryPlayMusic, { once: false });
    document.addEventListener('touchstart', tryPlayMusic, { once: false });
    // محاولة تلقائية
    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('bg-music').play().then(() => {
                musicStarted = true;
            }).catch(() => {});
        }, 500);
    });

    // ===== منطق إدخال التاريخ =====
    const stages = [
        { id: 'disp-day',   max: 2, label: 'ابدأي بإدخال اليوم ✨' },
        { id: 'disp-month', max: 2, label: 'الآن أدخلي الشهر 🌸' },
        { id: 'disp-year',  max: 4, label: 'وأخيراً السنة 💕' },
    ];
    let currentStage = 0;
    let inputs = ['', '', ''];

    const dotsContainer = document.getElementById('progress-dots');
    function buildDots() {
        dotsContainer.innerHTML = '';
        stages.forEach((_, i) => {
            const el = document.createElement('div');
            el.className = 'progress-dot' + (i <= currentStage ? ' filled' : '');
            dotsContainer.appendChild(el);
        });
    }
    buildDots();

    function updateDisplay() {
        const phs = ['--', '--', '----'];
        const maxes = [2, 2, 4];
        ['disp-day','disp-month','disp-year'].forEach((id, i) => {
            const el = document.getElementById(id);
            const val = inputs[i];
            el.textContent = val.length === 0 ? phs[i] : val.padEnd(maxes[i], '_');
            el.classList.toggle('active', i === currentStage);
        });
        document.getElementById('stage-hint').textContent = stages[currentStage]?.label || '';
    }

    function press(num) {
        if (currentStage >= stages.length) return;
        const max = stages[currentStage].max;
        if (inputs[currentStage].length < max) {
            inputs[currentStage] += num;
            updateDisplay();
            if (inputs[currentStage].length === max && currentStage < stages.length - 1) {
                setTimeout(nextStage, 280);
            }
        }
    }

    function backspace() {
        if (inputs[currentStage].length > 0) {
            inputs[currentStage] = inputs[currentStage].slice(0, -1);
            updateDisplay();
        } else if (currentStage > 0) {
            currentStage--;
            buildDots();
            updateDisplay();
        }
    }

    function nextStage() {
        const val = inputs[currentStage];
        if (val.length < stages[currentStage].max) {
            showError('أكملي الإدخال أولاً 💕');
            return;
        }
        if (currentStage < stages.length - 1) {
            currentStage++;
            buildDots();
            updateDisplay();
        } else {
            checkPassword();
        }
    }

    function checkPassword() {
        if (inputs[0] === CORRECT_DAY && inputs[1] === CORRECT_MONTH && inputs[2] === CORRECT_YEAR) {
            unlockPage();
        } else {
            showError('الرمز خطأ! حاولي مرة ثانية يا حلوة 💗');
            setTimeout(() => { inputs = ['','','']; currentStage = 0; buildDots(); updateDisplay(); }, 1300);
        }
    }

    function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2600);
    }

    function unlockPage() {
        tryPlayMusic();
        const lp = document.getElementById('login-page');
        lp.style.transition = 'all 0.45s ease';
        lp.style.opacity = '0';
        lp.style.transform = 'scale(0.88)';
        setTimeout(() => {
            lp.style.display = 'none';
            const mc = document.getElementById('main-content');
            mc.style.display = 'block';
            checkVideo();
            explodeButterflies();
        }, 420);
    }

    function checkVideo() {
        const container = document.getElementById('video-frame-container');

        // تحقق إذا الرابط YouTube
        const ytMatch = VIDEO_URL.match(
            /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
        );

        if (ytMatch) {
            // رابط يوتيوب — ضع iframe
            const videoId = ytMatch[1];
            container.innerHTML = `
                <iframe
                    width="100%" height="280"
                    src="https://www.youtube.com/embed/${videoId}?autoplay=0&rel=0"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen
                    style="display:block; border-radius:18px;">
                </iframe>`;
        } else if (VIDEO_URL && VIDEO_URL !== "") {
            // ملف محلي
            container.innerHTML = `
                <video id="main-video" controls playsinline style="width:100%;max-height:290px;display:block;border-radius:18px;">
                    <source src="${VIDEO_URL}" type="video/mp4">
                </video>`;
            const vid = document.getElementById('main-video');
            vid.addEventListener('error', () => {
                container.innerHTML = `
                    <div class="video-placeholder">
                        <span class="vid-icon">🎬</span>
                        تأكدي أن ملف <strong>video.mp4</strong> موجود بنفس المجلد<br>
                        أو ضعي رابط يوتيوب في VIDEO_URL
                    </div>`;
            }, { once: true });
        } else {
            container.innerHTML = `
                <div class="video-placeholder">
                    <span class="vid-icon">🎬</span>
                    ضعي رابط يوتيوب أو ملف <strong>video.mp4</strong> في الإعدادات
                </div>`;
        }
    }

    // ===== انفجار فراشات =====
    function explodeButterflies() {
        const emojis = ['🦋','🌸','💕','✨','💗','🌷','⭐','🎀','💝','🌺'];
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;

        for (let i = 0; i < 65; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'butterfly';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                const angle = Math.random() * Math.PI * 2;
                const d1 = 80 + Math.random()*130, d2 = 200+Math.random()*200, d3 = 320+Math.random()*260;
                const dur = 1.6 + Math.random() * 2;
                el.style.cssText = `
                    left:${cx}px; top:${cy}px;
                    font-size:${1.2 + Math.random()*1.5}rem;
                    animation-duration:${dur}s;
                    --dx1:${Math.cos(angle)*d1}px; --dy1:${Math.sin(angle)*d1}px;
                    --dx2:${Math.cos(angle+0.4)*d2}px; --dy2:${(Math.sin(angle+0.4)*d2-90)}px;
                    --dx3:${Math.cos(angle+0.8)*d3}px; --dy3:${(Math.sin(angle+0.8)*d3-210)}px;
                    --r1:${Math.random()*90-45}deg; --r2:${Math.random()*180-90}deg; --r3:${Math.random()*360-180}deg;
                `;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), dur*1000+300);
            }, i * 55);
        }
        // نثار مستمر
        const confEmojis = ['🦋','🌸','💕','✨','💗','⭐'];
        let n = 0;
        const iv = setInterval(() => {
            const el = document.createElement('div');
            el.className = 'confetti-piece';
            el.textContent = confEmojis[Math.floor(Math.random()*confEmojis.length)];
            el.style.left = Math.random()*100+'vw';
            el.style.top = '-30px';
            el.style.fontSize = (0.8+Math.random()*1.1)+'rem';
            const d = 3+Math.random()*4;
            el.style.animationDuration = d+'s';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), d*1000+300);
            if (++n > 90) clearInterval(iv);
        }, 180);
    }

    // ===== إيموجيات تتطاير عند ضغط الأزرار =====
    function burstEmojis(e, emojiList) {
        const rect = e.currentTarget.getBoundingClientRect();
        const cx = rect.left + rect.width/2;
        const cy = rect.top + rect.height/2;

        for (let i = 0; i < 10; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'btn-emoji';
                el.textContent = emojiList[Math.floor(Math.random()*emojiList.length)];
                const angle = (Math.random() * Math.PI * 2);
                const dist = 60 + Math.random()*80;
                el.style.cssText = `
                    left:${cx}px; top:${cy}px;
                    font-size:${1.1+Math.random()*0.8}rem;
                    animation-duration:${0.7+Math.random()*0.5}s;
                    --ex:${Math.cos(angle)*dist}px;
                    --ey:${Math.sin(angle)*dist-40}px;
                    --er:${Math.random()*120-60}deg;
                `;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1200);
            }, i * 50);
        }
    }

    // ===== بوبأب =====
    const popups = {
        love:   { title: 'رسالة الحب 💕',    text: LOVE_MESSAGE  },
        memory: { title: 'ذكرياتنا 🌸',       text: MEMORY_TEXT   },
    };

    function showPopup(type) {
        const d = popups[type];
        document.getElementById('popup-title').textContent = d.title;
        document.getElementById('popup-text').textContent  = d.text;
        document.getElementById('popup-overlay').style.display = 'flex';
    }
    function closePopup(e) {
        if (e.target === document.getElementById('popup-overlay')) closePopupDirect();
    }
    function closePopupDirect() {
        document.getElementById('popup-overlay').style.display = 'none';
    }

    let photoVisible = false;
    function togglePhoto() {
        photoVisible = !photoVisible;
        document.getElementById('photo-area').style.display = photoVisible ? 'block' : 'none';
    }

    updateDisplay();
</script>
</body>
</html>
